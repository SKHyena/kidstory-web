<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1200" />
<title>KidStory — OG artwork</title>
<style>
@font-face { font-family: KidStoryWordmark; src: url('/fonts/LoveYaLikeASister-Regular.ttf'); }
@font-face { font-family: KidStoryGaegu; src: url('/fonts/Gaegu-Bold.woff2'); font-weight: 700; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: #fbf5ed; color: #392c46; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.wash { position: absolute; left: 315px; top: -85px; width: 1030px; height: 800px; object-fit: contain; opacity: .93; }
.cards { position: absolute; left: 515px; top: 113px; width: 665px; height: 399px; object-fit: contain; }
.copy { position: absolute; left: 62px; top: 105px; }
.brand { display: flex; align-items: center; gap: 16px; }
.icon { width: 66px; height: 66px; border-radius: 18px; box-shadow: 0 5px 15px #7250841f; }
.wordmark { font: 39px KidStoryWordmark; color: #5a4272; }
.tagline { margin-top: 7px; color: #92729f; font-size: 10px; letter-spacing: 2px; }
h1 { margin: 43px 0 0; font-size: 47px; font-weight: 800; letter-spacing: -2px; line-height: 1.38; }
p { margin: 22px 0 0; color: #78677e; font: 700 24px/1.5 KidStoryGaegu; letter-spacing: -.4px; }
.label { display: inline-flex; margin-top: 30px; padding: 10px 17px; border: 1px solid #e4d5e7; border-radius: 30px; color: #77558c; background: #fffcf7b3; font-size: 13px; font-weight: 600; }
.footer { position: absolute; left: 64px; bottom: 35px; color: #96859c; font-size: 12px; letter-spacing: .6px; }
</style>
</head>
<body>
<img class="wash" src="/images/landing/download-brush-bridge-v2.webp" alt="" />
<img class="cards" src="/images/landing/download-cards.webp" alt="아이의 캐릭터에서 동화 장면으로 이어지는 그림 카드" />
<div class="copy">
  <div class="brand">
    <img class="icon" src="/images/landing/app-icon.webp" alt="" />
    <div><div class="wordmark">KidStory</div><div class="tagline">TONIGHT, A STORY ABOUT YOU</div></div>
  </div>
  <h1>오늘 밤에는,<br />네 이야기를 읽어 줄게.</h1>
  <p>우리 아이가 주인공이 되는, 세상에 단 한 권.</p>
  <div class="label">사진 한 장으로 만드는 AI 그림책</div>
</div>
<div class="footer">kidstory.skhyena.com</div>
</body>
</html>
